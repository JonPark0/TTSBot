# Docker Compose V2 (no top-level "version:" key needed)
services:
  tts-bot:
    build: .
    container_name: discord-cf-tts-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      # Persists the per-guild TTS channel config and the daily usage counter.
      # A named volume avoids host/container UID permission mismatches.
      # Inspect it with:  docker compose exec tts-bot cat /app/data/store.json
      - tts-data:/app/data
    # The bot only makes outbound connections — no ports need to be published.
    # Lets LOCAL_TTS_URL=http://host.docker.internal:8850 reach the card server on this host
    # (built in on Docker Desktop; this line adds it on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tts-data:
